name: brisko_billing
description: "Brisko Billing - point of sale and billing application for the Brisko Pizza outlet."
# Private application. Never published to pub.dev.
publish_to: 'none'

# version: <build-name>+<build-number>
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management. ChangeNotifier + Provider keeps UI free of business logic
  # without pulling in a code-generation heavy framework.
  provider: 6.1.5+1

  # Local database. sqflite is the plain SQLite binding, so the schema and every
  # query stay visible in this repository rather than behind a generator.
  sqflite: 2.4.4

  # Used only to build the database file path.
  path: 1.9.1

  # Windows RAW printing. Thin, actively maintained FFI bindings to the Win32 print
  # spooler (OpenPrinter/StartDocPrinter/WritePrinter/...), used on Windows only to hand
  # the ESC/POS bytes to the OS print queue with the RAW datatype. Pure Dart with lazy
  # DLL loading, so it compiles on macOS without pulling in any native build step and is
  # never invoked off Windows. The macOS transport uses the CUPS command-line tools and
  # needs no package at all.
  win32: ^5.5.4
  # Utf16 helpers and calloc for the Win32 FFI structs. Already present transitively; a
  # direct dependency because the Windows transport imports it directly.
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Required to run SQLite inside `flutter test`. sqflite talks to the platform
  # plugin, which does not exist in the Dart test VM; this provides the native
  # implementation so the database layer can be tested without a device.
  # Test-only, never shipped.
  sqflite_common_ffi: 2.4.3

flutter:
  uses-material-design: true

  # Bundled images. The outlet logo (assets/images/brisko_logo.png) is picked up from
  # here and printed at the top of receipts; see lib/app/receipt_logo.dart. Declaring
  # the directory means the logo is bundled the moment the file is dropped in, with no
  # further pubspec change.
  assets:
    - assets/images/
